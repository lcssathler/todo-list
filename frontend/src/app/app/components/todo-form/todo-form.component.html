<form (ngSubmit)="create()" class="flex gap-3 p-6 bg-white rounded-xl shadow-sm border border-gray-200 mb-6">
  <input
    [(ngModel)]="title"
    name="title"
    placeholder="O que precisa fazer?"
    class="flex-1 px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition placeholder:opacity-60 placeholder:text-gray-500"
  />

  <button
    type="submit"
    [disabled]="title.trim().length === 0"
    class="px-6 py-3 bg-green-300 text-white font-bold rounded-lg hover:bg-green-500 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:text-white/90 transition flex items-center gap-2 shadow-sm"
  >

    <mat-icon class="text-lg">add</mat-icon>
    Add
  </button>
</form>
