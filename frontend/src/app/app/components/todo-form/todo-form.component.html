<form (ngSubmit)="create()" 
      class="flex gap-3 p-6 bg-white rounded-xl shadow-sm border border-gray-200 mb-6">
  
  <input 
    [(ngModel)]="title" 
    name="title"
    placeholder="What's your plan?"  
    class="flex-1 px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition placeholder:opacity-60 placeholder:text-gray-500">

  <button 
  type="submit" 
  [disabled]="title.trim().length === 0"
  class="px-6 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition flex items-center gap-2 disabled:opacity-50">
  
  <svg xmlns="http://www.w3.org/2000/svg" 
       class="h-5 w-5" 
       fill="none" 
       viewBox="0 0 24 24" 
       stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
          d="M12 4v16m8-8H4" />
  </svg>
  Add
</button>
</form>
