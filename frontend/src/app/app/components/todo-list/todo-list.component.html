<div class="max-w-2xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">To Do List</h1>

  <app-todo-form (todoCreated)="loadTodos()"></app-todo-form>

  <ul class="mt-6 space-y-3">
    <li *ngFor="let todo of todos" 
        class="flex items-center justify-between p-4 bg-white rounded-lg shadow-sm border">
      <div class="flex items-center space-x-3">
        <input type="checkbox" 
               [checked]="todo.completed" 
               (change)="toggle(todo.id!)"
               class="w-5 h-5 text-blue-600 rounded">
        <span [class]="todo.completed ? 'line-through text-gray-500' : 'text-gray-800'">
          {{ todo.title }}
        </span>
      </div>
      <button (click)="delete(todo.id!)" 
              class="text-red-500 hover:text-red-700 text-sm font-medium">
        Delete
      </button>
    </li>
  </ul>

  <p *ngIf="todos.length === 0" class="text-gray-500 text-center mt-6">
    To Do list empty. Add a new task!
  </p>
</div>
