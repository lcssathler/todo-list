<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
  <div class="max-w-2xl mx-auto">
    
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
      To-Do List
    </h1>

    <app-todo-form (todoCreated)="loadTodos()"></app-todo-form>

    <div class="space-y-3">
      <div *ngFor="let todo of todos" class="fade-in"
           class="group flex items-center justify-between p-4 bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
        
        <div class="flex items-center space-x-3">
          <input 
            type="checkbox" 
            [checked]="todo.completed" 
            (change)="toggle(todo.id!)"
            class="w-5 h-5 text-primary rounded focus:ring-primary cursor-pointer">
          
          <span [class]="todo.completed 
            ? 'line-through text-gray-500' 
            : 'text-gray-800 font-medium'">
            {{ todo.title }}
          </span>
        </div>

        <button 
          (click)="delete(todo.id!)" 
          class="opacity-0 group-hover:opacity-100 transition-opacity text-danger hover:text-danger/80 text-sm font-medium">
          <mat-icon class="text-base">delete</mat-icon>
          
        </button>
      </div>
    </div>

    <p *ngIf="todos.length === 0" 
       class="text-center text-gray-500 mt-8 italic">
      No tasks available. Add a new task
    </p>
  </div>
</div>
